    <style id="sk-initial-seo-style">
      html,body{margin:0;background:#fff;color:#151515;font-family:Inter,system-ui,sans-serif}
      #sk-seo-initial{min-height:100vh;padding-bottom:76px;background:#fff}
      #sk-seo-initial *{box-sizing:border-box}
      #sk-seo-initial a{text-decoration:none}
      #sk-seo-initial .sk-pre-pin-header{display:flex;align-items:center;gap:13px;padding:16px 14px 10px;max-width:1300px;margin:auto}
      #sk-seo-initial .sk-pre-pin-brand{display:flex;align-items:center;gap:7px;margin-right:auto;color:#111;font-size:25px;letter-spacing:-.065em;font-weight:900}
      #sk-seo-initial .sk-pre-pin-brand span{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#111;color:#fff;font-size:16px}
      #sk-seo-initial .sk-pre-pin-add,#sk-seo-initial .sk-pre-pin-menu{display:grid;place-items:center;width:40px;height:40px;color:#111;font-size:31px}
      #sk-seo-initial .sk-pre-pin-tabs{display:flex;align-items:center;gap:20px;overflow-x:auto;scrollbar-width:none;white-space:nowrap;padding:12px 13px 0;max-width:1300px;margin:auto}
      #sk-seo-initial .sk-pre-pin-tabs a{position:relative;flex:none;padding:6px 0 15px;font-size:16px;color:#171717}
      #sk-seo-initial .sk-pre-pin-tabs a[aria-current]{font-weight:800;border-bottom:3px solid #111}
      #sk-seo-initial .sk-pre-pin-masonry{columns:2;column-gap:8px;max-width:1300px;margin:10px auto;padding:0 8px}
      #sk-seo-initial .sk-pre-pin-item{display:inline-block;width:100%;break-inside:avoid;margin:0 0 16px;color:#1b1b1b}
      #sk-seo-initial .sk-pre-pin-item img{width:100%;height:auto;min-height:190px;object-fit:cover;border-radius:22px;background:#f2f2f2}
      #sk-seo-initial .sk-pre-pin-item-1 img{min-height:260px}
      #sk-seo-initial .sk-pre-pin-item-2 img{min-height:225px}
      #sk-seo-initial .sk-pre-pin-item-3 img{min-height:290px}
      #sk-seo-initial .sk-pre-pin-item span{display:block;padding:5px 5px 0;font-size:12px;font-weight:600}
      #sk-seo-initial .sk-pre-pin-more{border-top:1px solid #eee;margin-top:10px}
      #sk-seo-initial .sk-pre-pin-more summary{list-style:none;cursor:pointer;padding:16px;color:#333;font-weight:750;font-size:13px}
      #sk-seo-initial .sk-pre-pin-more summary::-webkit-details-marker{display:none}
      #sk-seo-initial .sk-pre-pin-more section,#sk-seo-initial .sk-pre-pin-more footer{max-width:750px;margin:auto;padding:12px 17px;border-bottom:1px solid #eee}
      #sk-seo-initial .sk-pre-pin-more h1{font-size:24px;line-height:1.2}
      #sk-seo-initial .sk-pre-pin-more h2{font-size:18px}
      #sk-seo-initial .sk-pre-pin-more h3{font-size:14px}
      #sk-seo-initial .sk-pre-pin-more p,#sk-seo-initial .sk-pre-pin-more li{font-size:13px;line-height:1.65}
      #sk-seo-initial .sk-pre-pin-more a{color:#7653a7}
      #sk-seo-initial .sk-pre-pin-kicker{font-size:10px;letter-spacing:.15em;font-weight:750}
      #sk-seo-initial .sk-pre-pin-bottom{position:fixed;left:50%;bottom:19px;transform:translateX(-50%);display:flex;align-items:center;justify-content:space-around;width:205px;height:61px;padding:6px;background:#fff;border-radius:26px;box-shadow:0 6px 25px #0002}
      #sk-seo-initial .sk-pre-pin-bottom a{display:grid;place-items:center;width:55px;height:49px;color:#111;font-size:31px}
      @media(min-width:740px){#sk-seo-initial .sk-pre-pin-masonry{columns:3;column-gap:14px}}
      @media(min-width:1080px){#sk-seo-initial .sk-pre-pin-masonry{columns:4}}
    </style>
