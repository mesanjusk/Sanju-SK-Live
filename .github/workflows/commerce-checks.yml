name: Commerce security and UI checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  commerce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check backend syntax
        run: |
          node --version
          node --check IDBackend/index.js
          node --check IDBackend/routes/googleMerchantFeed.js
          node --check IDBackend/utils/googleMerchantFeed.js
          node --check IDBackend/utils/googleMerchantCache.js
          node --check IDBackend/scripts/enrichCatalog.js
          node --check IDBackend/utils/enrichListingSeo.js
          node --check IDBackend/utils/catalogCacheRevision.js
          node --check IDBackend/routes/orderRoutes.js
          node --check IDBackend/routes/userRoutes.js
          node --check IDBackend/models/User.js
          node --check IDBackend/models/Order.js
          node --check IDBackend/utils/orderPricing.js
          node --check IDBackend/utils/orderLifecycle.js
          node --check IDBackend/utils/orderSync.js
          node --check IDBackend/routes/analyticsRoutes.js
          node --check IDBackend/utils/growthAnalytics.js
      - name: Test server-authoritative pricing and payment verification
        run: node --test IDBackend/tests/*.test.js
      - name: Test Wedding-first order, intent ranking and return caching
        run: |
          node --test IDFrontend/src/components/mobile/categoryOrder.test.mjs
          node --test IDFrontend/src/components/mobile/catalogSessionCache.test.mjs
          node --test IDFrontend/src/hooks/consentPreference.test.mjs
          node --test IDFrontend/src/components/mobile/galleryAspect.test.mjs
      - name: Print 15 safe illustrative SEO enrichment previews
        run: node IDBackend/scripts/enrichCatalog.js --examples --limit=15
      - name: Attempt read-only 15-product live catalog preview (no writes)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 3
        run: node IDBackend/scripts/enrichCatalog.js --preview-api --limit=15
      - name: Check frontend bundle
        run: |
          npm ci --prefix IDFrontend
          npm run build --prefix IDFrontend
